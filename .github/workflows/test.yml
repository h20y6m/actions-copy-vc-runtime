name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
jobs:
  test:
    name: Test

    strategy:
      matrix:
        include:
          - runs-on: windows-latest
            arch: 'x64'
          - runs-on: windows-latest
            arch: 'x86'
          - runs-on: windows-11-arm
            arch: 'arm64'

      fail-fast: false

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: h20y6m/actions-setup-msvc-env@v2
        with:
            arch: ${{ matrix.arch }}

      - name: Build test binary
        working-directory: tests
        run: cl.exe /MD /EHsc main.cpp

      - name: Copy VC++ runtime DLLs
        uses: ./
        with:
            bindir: tests

      - name: Check
        shell: pwsh
        working-directory: tests
        run: Get-ChildItem
